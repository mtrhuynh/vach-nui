   loading screen — after 25 s show a reload hint on the loading card itself. */

<script>
/* Boot diagnostics: records boot stages + the last error; the loading card
   only shows the trace when an error exists. */
window.__boot = []; window.__bootErr = '';
window.bootMark = function (s) { window.__boot.push(s); };
window.addEventListener('error', function (e) {
  window.__bootErr = 'ERR: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__bootErr = 'REJECT: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
setInterval(function () {
  var ld = document.getElementById('loading'); if (!ld) return;
  var t = document.getElementById('bootTrace'); if (!t) return;
  var txt = window.__bootErr ? ((window.__boot.length ? window.__boot.join(' > ') : 'module chua chay') + ' || ' + window.__bootErr) : '';
  if (t.textContent !== txt) t.textContent = txt;
}, 600);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const bootMark = window.bootMark || function () {};
bootMark('imports-ok');

const VN_VER = '0.2.22';

/* ================= World layout data (built geometry) =================
   The island is models/mountain.glb scaled x40, wrap y=-8.12 (apron band,
   model y 0.203, sits near world y=0). Terrain height/walkability comes
   from heightmap.js — a ray-cast bake of the real mesh (see Ground model).
   Only the built additions keep analytic ground: the rope bridge and
   its end disc. The bridge (models/bridge.glb: stone slabs, post-and-
   rope rails) spans EAST from the launch shelf to the end disc, local
   +X toward the disc. Its deck sags, so placement is a single source of
   truth: BRIDGE feeds BOTH the mesh transform and deckYAt(), and the
   walked surface can never drift from the seen one. Around centre
   (6.32, -6); samples are the measured deck-top heights along the
   model (t = 0 west end, 1 east). v0.2.9: the span is STRETCHED along
   X only — scaleX 9.676 = 8.2 x 1.18, scaleY/Z stay 8.2 — because at
   8.03 m the west tip floated past the launch shelf edge; stretched
   to 9.48 m it lands ON the shelf (mesh span 1.58..11.06). The deck
   ends differ (0.090 west vs 0.105 east local), so the group is
   pitched by tilt = atan(-(0.105 - 0.090) * scaleY / (0.98 * scaleX))
   = atan(-0.123 / 9.48248) = -0.012971 rad, and baseY = 12.4806 (the
   ends-solve barely moves with the stretch) puts BOTH deck ends at
   world y = 13.28 and the sagging middle at ~12.73. (v0.2.8: raised
   +0.38 from the original 12.1006 — a rock rib under the span at
   x 5.1-6.9 reads up to 12.74 on the heightmap and pierced the old
   deck line. Re-verified for the stretched profile in v0.2.9: the
   deck still clears the rib everywhere along the strip, min margin
   +0.053 at x=6.2. The deck steps DOWN ~0.37 onto the end disc
   (12.90) at the east seam and 0.15 down to the launch shelf (13.13)
   at the west — both inside the 0.65 rise gate.) */
const BRIDGE = {
  cx: 6.32, cz: -6.0, scaleX: 9.676, scaleY: 8.2, baseY: 12.4806, tilt: -0.012971,
  x0: 1.58, x1: 11.06,   // mesh span: cx -+ 0.49 * scaleX = 1.579..11.061
  groundX1: 10.40,      // ground strip still ends at the END_DISC edge
                        // (11.5 - 1.1) although the stretched mesh
                        // overshoots to 11.06 and lands on the Buddha
                        // rock; the END_DISC check takes over at 12.90 —
                        // a deliberate ~0.37 step down, inside the gate
  hw: 1.05,             // walkable half-width of the deck strip
  samples: [
    [0.03, 0.090], [0.10, 0.104], [0.16, 0.106], [0.23, 0.099], [0.30, 0.072],
    [0.37, 0.052], [0.43, 0.042], [0.50, 0.031], [0.57, 0.034], [0.63, 0.044],
    [0.70, 0.055], [0.77, 0.076], [0.84, 0.088], [0.90, 0.101], [0.97, 0.105],
  ],
};
const END_DISC = { x: 11.5, z: -6.0, y: 12.9, r: 1.1 };
/* Buddha point layout (v0.2.11, Anita): statue x1.5 at the back-RIGHT
   corner, the one candle cluster shrunk at the back-LEFT. Her corner
   (~(12.10, -6.75)) is OFF the mini island: measured on the real
   heightmap, the island's south rim ends at z ~ -6.7 and the target
   centre itself has NO surface (the base disc would hang ~30% over
   the void, footprint height range > 1.2 m everywhere in that zone).
   The statue therefore sits at the gentlest fully-supported spot on
   the same (back, -z) side: base centre on the flat apron band,
   rendered surface 12.952, viewer-side float <= 0.08, the peak rising
   behind its back rim like a niche. Full evidence: vn-harness5/run9. */
const BUDDHA_POS = { x: 11.85, z: -6.10 };
/* Miniature-island pose (set on the buddhaRock group in the build
   section; kept here as the single source for miniSurfaceY). */
const BUDDHA_ROCK_POSE = { x: 12.175, y: 12.271, z: -5.25, rotY: -Math.PI / 2 };
/* Rendered surface height of the miniature island at world (x, z) —
   the same identity the offline harness verifies through the group's
   world matrix: island coords = rock-local x (40/3) (the mini runs
   the island model at x3, the main island at x40, apron 0.203 ->
   island y 0 via y -8.12); rendered = poseY + 0.075 * H + 0.609.
   Returns null where the island has no surface. */
function miniSurfaceY(x, z) {
  const dx = x - BUDDHA_ROCK_POSE.x, dz = z - BUDDHA_ROCK_POSE.z;
  const c = Math.cos(BUDDHA_ROCK_POSE.rotY), s = Math.sin(BUDDHA_ROCK_POSE.rotY);
  const lx = c * dx - s * dz, lz = s * dx + c * dz;
  const h = sampleGround(lx * (40 / 3), lz * (40 / 3));
  return h === null ? null : BUDDHA_ROCK_POSE.y + 0.075 * h + 0.609;
}
/* Mouth filler disc (v0.2.8, ground-only, no visual): a groove crosses
   the straight route at the bridge mouth — terrain at x~2.25, z=-6
   dips to 11.86 while the launch shelf reads ~13.13 and the (raised)
   deck starts at 13.28, a >1.0 cliff in ground terms that stalled a
   straight tap toward the bridge. This flat disc spans the groove so
   the centreline reads shelf ~13.13 -> filler 13.20 -> deck 13.28.
   Rim audit vs the heightmap (12-point ring): the worst terrain under
   the rim is 11.635 (drop 1.565 from the disc top, inside the 1.6
   allowance) — the disc only bridges the shallow groove, it never
   spans open air over the deep drop. */
const MOUTH_DISC = { x: 1.95, z: -6.0, y: 13.20, r: 0.85 };
/* Pilgrimage routing (v0.2.14): a journey whose target lies past the
   bridge is routed along the launch corridor — STAGE_PT on the launch
   shelf, then the mouth — never beelined. Measured reason: the deck's
   north edge stands ~0.92 above the bank terrain beside it (12.37 ->
   deck 13.29), over the 0.65 rise gate, so a diagonal approach from
   the mountain stalls ~1.1 m short of the mouth (probe, vn-harness5);
   along the corridor the steps are ~0.15. BOW_SPOT is where the
   scripted pilgrimage ends: the disc's west side, clear of the
   statue's base (run9's bow spot). */
const STAGE_PT = { x: 0.9, z: -6.0 };
const BOW_SPOT = { x: 10.95, z: -6.0 };
/* Deck-top height (world y) of the bridge at a world x: lerp the
   measured profile (t mapped through scaleX), then apply the same
   scales + tilt + baseY as the mesh group transform — heights run
   through scaleY, the along-span tilt lever through scaleX. */
function deckYAt(worldX) {
  const xl = (worldX - BRIDGE.cx) / BRIDGE.scaleX;
  let t = (xl + 0.49) / 0.98;
  t = Math.min(1, Math.max(0, t));
  const s = BRIDGE.samples;
  let dy = s[s.length - 1][1];
  if (t <= s[0][0]) dy = s[0][1];
  else {
    for (let i = 1; i < s.length; i++) {
      if (t <= s[i][0]) {
        dy = s[i - 1][1] + (s[i][1] - s[i - 1][1]) * (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
        break;
      }
    }
  }
  return BRIDGE.baseY
    + xl * BRIDGE.scaleX * Math.sin(BRIDGE.tilt)
    + dy * BRIDGE.scaleY * Math.cos(BRIDGE.tilt);
}

/* ================= State (all declared before animate() runs) ================= */
let renderer, scene, camera, controls, clock;
let player = null;              // avatar root group
let bodyG = null, upperG = null; // rig: upperG is the bow pivot
let walkTarget = null;          // Vector3 or null
let faceTarget = null;          // target rotation.y or null
const keys = { fwd: false, left: false, right: false };
let bowGroup = null, rigG = null; // static rig wrappers around bodyG (temple rig)
let buddhaGroup = null;
let bridgeGroup = null;         // rope-bridge group (transform from BRIDGE)
let buddhaRock = null;          // miniature island under the Buddha (v0.2.9)
const lampGroups = [];  // candle lamp groups (8 lotus + 1 Buddha cluster)
const lampGlows = [];   // { mat, sprite, base, phase } per lamp, for the flicker loop
let animState = 'idle';           // idle | walk | xa | bow | recover
let animT = 0;                    // time inside xa / recover
let stillT = 0;                   // seconds without movement (breath gate)
let walkPhase = 0, walkBlend = 0; // gait cycle + ease in/out (~0.15 s)
let bowPhase = 'enter', bowT = 0, bowCount = 0, bowExitDur = 0.5; // temple-pattern bow sub-machine
let bowPitch = 0, bowPitch0 = 0, bowScale = 1;   // currently applied bow pose
let recDur = 0.4, recXa0 = 0;
let onEndPrev = false, walkInputPrev = false;
/* Pilgrimage (v0.2.14): halved walk speed; a `journey` is an armed
   multi-leg walk (staging -> mouth ritual pause -> final target); a
   `pilgrim` is the scripted end-to-end procession (journey + arrival
   xa + temple bow) at a slower procession pace. */
const WALK_SPEED = 1.3;          // m/s — halved from 2.6 in v0.2.14
const PROCESSION_PACE = 0.65;    // paceScale while a pilgrimage runs
const RITUAL_HOLD = 2.0;         // seconds the mouth-pause xa dip is held
let paceScale = 1;
let xaHoldT = 0.25;              // xa dip hold (ritual pause overrides)
let journey = null;              // {x, z, leg, retries, xaSeen, legT}
let pilgrim = null;              // {stage, xaSeen, bowSeen, stillT}
let ritualXa = false;            // the running xa is the mouth ritual
const lastPos = new THREE.Vector3(0, 0, 10);
const XA_PITCH = 0.34, BOW_PITCH = 0.55, SEAT_SQ = 0.78;
function smooth01(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
let firstFrame = true;
const clouds = [];
const camTmp = new THREE.Vector3();
const camDelta = new THREE.Vector3();
/* Follow camera (v0.2.5): eases behind the avatar while KEY-driven only. */
let camManualUntil = -1;   // clock seconds; follow suspended while elapsedTime < this
let camOrbiting = false;   // between OrbitControls 'start' and 'end'
let camPtrDown = false, camPtrDrag = false, camPtrX = 0, camPtrY = 0;
const camOff = new THREE.Vector3();
const camSph = new THREE.Spherical();
/* Session resume (v0.2.5; hardened v0.2.6: localStorage + pagehide writes) */
let vnSaveT = -1;          // clock time of the last session snapshot
let sessionRestored = null; // {x, z, ry} when a snapshot was applied at boot
const projV = new THREE.Vector3();
const raycaster = new THREE.Raycaster();
const tapPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const tapPoint = new THREE.Vector3();
let downX = 0, downY = 0, downT = 0;

const bowChip = document.getElementById('bowChip');

/* Heightmap decode (data in heightmap.js): done up here, before any
   building, so placement code can sample the real surface immediately. */
const HMAP_SENTINEL = -999;
let hmapData = null, HMAP_N = 0, HMAP_MIN = 0, HMAP_CELL = 1;
try {
  const H = window.VN_HMAP;
  if (H && H.data) {
    const bin = atob(H.data);
    const buf = new ArrayBuffer(bin.length);
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    hmapData = new Float32Array(buf);
    HMAP_N = H.n; HMAP_MIN = H.min; HMAP_CELL = H.cell;
  }
} catch (e) { hmapData = null; }

/* ================= Renderer / scene / camera ================= */
renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('app').appendChild(renderer.domElement);
bootMark('renderer-ok');

scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8f2, 60, 240);
camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 600);
/* Default framing (v0.2.14, Anita's correction): TEMPLE-style — the
   camera sits IN the space at the monk's scale, not pulled back into
   a route-spanning diorama shot (she rejected that: the world shrank
   into a corner of the frame). Spawn: the monk stands at (0,0.43,10)
   facing the cliff (-z); the camera waits ~5.7 m behind-left of him,
   target at his head height, so he reads large in frame and the
   south face towers behind/above him — the bridge crosses high in
   the distance as environment, discovered as he climbs. The
   target-follow in animate() keeps this proximity as he moves. */
camera.position.set(-1.6, 2.9, 15.3);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.58;
controls.minDistance = 3;
/* maxDistance 70 -> 12 (v0.2.14): limited retreat is the other half
   of the temple feel. At 12 m the 1.15 m monk still spans ~10% of
   the frame height and the 9.5 m bridge fills a portrait's width
   when he crosses it; beyond that the world deflates into scenery.
   (Key-drive follow keeps its own tighter 3..8 radius, unchanged.) */
controls.maxDistance = 12;
controls.target.set(0, 1.43, 10);
/* The orbit target may be panned, but never out of this box: the
   island's walkable footprint plus headroom (spawn target (0,1.4,10),
   route targets up to ~(11.5,13.9,-6), the low lotus terraces at the
   island's edges) — the avatar-follow therefore never fights it,
   while the target can no longer be dragged off into empty sky. */
const CAM_BOX = { x0: -16, x1: 17, y0: -2, y1: 17, z0: -14, z1: 16 };
function clampCamTarget() {
  const t = controls.target;
  const cx = Math.min(CAM_BOX.x1, Math.max(CAM_BOX.x0, t.x));
  const cy = Math.min(CAM_BOX.y1, Math.max(CAM_BOX.y0, t.y));
  const cz = Math.min(CAM_BOX.z1, Math.max(CAM_BOX.z0, t.z));
  if (cx !== t.x || cy !== t.y || cz !== t.z) {
    camera.position.x += cx - t.x;
    camera.position.y += cy - t.y;
    camera.position.z += cz - t.z;
    t.set(cx, cy, cz);
  }
}
clock = new THREE.Clock();
controls.addEventListener('start', () => { camOrbiting = true; });
controls.addEventListener('end', () => {
  camOrbiting = false;
  if (camPtrDrag) { camManualUntil = clock.elapsedTime + 3; camPtrDrag = false; }
});

/* ================= Canvas textures (no custom shaders) ================= */
function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); return t;
}
const glowTex = radialTex(128, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const cloudTex = radialTex(256, [[0, 'rgba(255,255,255,0.95)'], [0.45, 'rgba(255,255,255,0.55)'], [0.75, 'rgba(255,255,255,0.18)'], [1, 'rgba(255,255,255,0)']]);

/* Sky gradient: a 4x512 canvas texture repainted by the real-time sky
   system (v0.2.15) whenever the minute ticks over. SKY_POS are the
   gradient stop positions; the colours come from skyStateAt(). */
const SKY_POS = [0.0, 0.38, 0.60, 0.74, 0.82, 0.88, 1.0];
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
function paintSky(stops) {
  const gr = skyCtx.createLinearGradient(0, 0, 0, 512);
  for (let i = 0; i < stops.length; i++) gr.addColorStop(SKY_POS[i], '#' + stops[i].getHexString());
  skyCtx.fillStyle = gr; skyCtx.fillRect(0, 0, 4, 512);
  skyTex.needsUpdate = true;
}

/* ================= Sky, lights ================= */
{
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(320, 24, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })
  );
  scene.add(dome);
}
const hemi = new THREE.HemisphereLight(0xcfe0f4, 0x8a7a5f, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1da, 2.3);
sun.position.set(-26, 40, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 120;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xaac4e8, 0.55);
fill.position.set(20, 30, -30);
scene.add(fill);

/* v0.2.18 — moonlight from the moon: the sun's DAY position, its
   working distance, and the moon's axis. applySky blends the light
   from SUN_DAY_POS onto the moon's direction as `night` rises (see
   applySky), so by full night the scene is lit FROM the moon sprite.
   MOON_POS lives here because applySky and the sprite both need it. */
const SUN_DAY_POS = sun.position.clone();
const SUN_DIST = SUN_DAY_POS.length();                    // ~52.5
const MOON_POS = new THREE.Vector3(259.5, 74.4, -6.8);    // |pos| = 270, inside the dome
const MOON_LIGHT_POS = MOON_POS.clone().normalize().multiplyScalar(SUN_DIST);

/* ================= Real-time sky (v0.2.15) =================
   Sky + lighting follow the device's real local clock, like the
   Temple: keyframed palettes across the day (night -> dawn -> morning
   -> noon -> afternoon -> golden -> dusk -> night), lerped by the
   current local time and re-applied when the minute ticks (see the
   check in animate()). No toggle — real time is simply the behaviour.
   The noon keyframe IS the old fixed look (same stops/fog/lights), so
   midday is unchanged. Colour/intensity travel with the keys; the
   sun's POSITION was fixed through v0.2.16, but v0.2.18 blends it
   onto the moon's axis as `night` rises (Anita: moonlight must come
   from the moon) — by day it is exactly the old fixed position.
   Candle glows are untouched — they read stronger at night on their
   own. skyStateAt(hours) is pure (no Date inside) for the harness.
   v0.2.16: every keyframe also carries `night` (0..1 nightness);
   applySky feeds it to the star field and the moon below. */

  camSph.theta += dTheta * k;
  camSph.phi += (1.12 - camSph.phi) * k;
  camSph.radius += (wantRadius - camSph.radius) * k;
  camera.position.copy(controls.target).add(camOff.setFromSpherical(camSph));
}

/* Session resume: snapshot the run so a refresh does not lose the climb. */
function vnStore() {
  // v0.2.6: localStorage — sessionStorage did not survive a refresh in
  // Anita's in-app browser, which cost the restored run.
  try { return window.localStorage || null; } catch (e) { return null; }
}
function vnLegacyStore() {
  try { return window.sessionStorage || null; } catch (e) { return null; }
}
function saveSession() {
  const s = vnStore(); if (!s || !player) return;
  try {
    s.setItem('vn-session', JSON.stringify({
      x: player.position.x, z: player.position.z, ry: player.rotation.y,
      cx: camera.position.x, cy: camera.position.y, cz: camera.position.z,
      t: Date.now(),
    }));
  } catch (e) {}
}
window.addEventListener('beforeunload', saveSession);
window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveSession();
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  // Real-time sky: re-apply when the local minute ticks over.
  { const dNow = new Date(); const mNow = dNow.getHours() * 60 + dNow.getMinutes();
    if (mNow !== skyLastMin) { skyLastMin = mNow; applySky(skyNowHours()); } }
  if (t - vnSaveT >= 1) { vnSaveT = t; saveSession(); }
  if (!animLocked()) movePlayer(dt);
  rideGround(dt);
  updateAnim(dt, t);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 115) c.position.x = -115;
  }
  for (const L of lampGlows) {
    L.mat.opacity = 0.55 + 0.13 * Math.sin(t * 11 + L.phase) + 0.05 * Math.sin(t * 23 + L.phase * 2);
    const fs = L.base * (1 + 0.06 * Math.sin(t * 9 + L.phase * 1.3));
    L.sprite.scale.set(fs, fs, 1);
  }
  // camera target follows the avatar; camera rides along by the same delta
  camTmp.set(player.position.x, player.position.y + 1.0, player.position.z);
  camDelta.copy(camTmp).sub(controls.target).multiplyScalar(Math.min(1, 5 * dt));
  controls.target.add(camDelta);
  camera.position.add(camDelta);
  followCamera(dt);
  clampCamTarget();
  controls.update();
  updateChip();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    bootMark('frame-1');
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
  }
}
/* Offline-harness hooks (no effect in normal use). */
window.__vn = {
  get player() { return player; }, get bodyG() { return bodyG; },
  get upperG() { return upperG; }, get bowGroup() { return bowGroup; },
  get state() { return animState; }, get bowPhase() { return bowPhase; },
  get bowPitch() { return bowPitch; }, get bowScale() { return bowScale; },
  get walkBlend() { return walkBlend; },
  chip: bowChip, scene: () => scene,
  lamps: () => lampGroups, lampGlows: () => lampGlows,
  startXa, startBow, sampleGround, groundAt, deckYAt, miniSurfaceY,
  bridge: () => bridgeGroup, bridgeData: () => BRIDGE, mouthDisc: () => MOUTH_DISC,
  buddhaRock: () => buddhaRock, endDisc: () => END_DISC,
  buddha: () => buddhaGroup, buddhaPos: () => BUDDHA_POS,
  lotusSites: () => LOTUS_SITES, blockers: () => BLOCKERS,
  resolveTarget, insideBlocker,
  skyAt: (h) => {
    const s = skyStateAt(h);
    return {
      stops: s.stops.map(c => '#' + c.getHexString()), fog: '#' + s.fog.getHexString(),
      hemiSky: '#' + s.hemiSky.getHexString(), hemiGround: '#' + s.hemiGround.getHexString(),
      hemiI: s.hemiI, sun: '#' + s.sun.getHexString(), sunI: s.sunI,
      fillI: s.fillI, exp: s.exp, cloud: '#' + s.cloud.getHexString(),
      night: s.night,
    };
  },
  applySky,
  moonPhase: (ms) => moonPhaseAt(ms),
  setNow: (ms) => { vnNowMs = ms; },
  stars: () => starPoints, moon: () => moonSprite,
  backdrop: () => backdrop, seaBand: () => seaBand, clouds: () => clouds,
  sun: () => sun, sunDayPos: () => SUN_DAY_POS,
  moonBucket: () => moonPaintedBucket,
  get faceTarget() { return faceTarget; },
  setWalk: (x, z) => { setWalkTarget(x, z); },
  pilgrimage: startPilgrimage,
  get pilgrimStage() { return pilgrim ? pilgrim.stage : null; },
  get journeyLeg() { return journey ? journey.leg : null; },
  get paceScale() { return paceScale; },
  walkSpeed: () => WALK_SPEED,
  keys,
  camera: () => camera, controls: () => controls,
  get camManualUntil() { return camManualUntil; },
  get camOrbiting() { return camOrbiting; },
  saveSession,
};
animate();
</script>
