<script>
/* Boot diagnostics: records boot stages + the last error; the loading card
   only shows the trace when an error exists. */
window.__boot = []; window.__bootErr = '';
window.bootMark = function (s) { window.__boot.push(s); };
window.addEventListener('error', function (e) {
  window.__bootErr = 'ERR: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__bootErr = 'REJECT: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
setInterval(function () {
  var ld = document.getElementById('loading'); if (!ld) return;
  var t = document.getElementById('bootTrace'); if (!t) return;
  var txt = window.__bootErr ? ((window.__boot.length ? window.__boot.join(' > ') : 'module chua chay') + ' || ' + window.__bootErr) : '';
  if (t.textContent !== txt) t.textContent = txt;
}, 600);
</script>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const bootMark = window.bootMark || function () {};
bootMark('imports-ok');

const VN_VER = '0.2.12';

/* ================= World layout data (built geometry) =================
   The island is models/mountain.glb scaled x40, wrap y=-8.12 (apron band,
   model y 0.203, sits near world y=0). Terrain height/walkability comes
   from heightmap.js — a ray-cast bake of the real mesh (see Ground model).
   Only the built additions keep analytic ground: the rope bridge and
   its end disc. The bridge (models/bridge.glb: stone slabs, post-and-
   rope rails) spans EAST from the launch shelf to the end disc, local
   +X toward the disc. Its deck sags, so placement is a single source of
   truth: BRIDGE feeds BOTH the mesh transform and deckYAt(), and the
   walked surface can never drift from the seen one. Around centre
   (6.32, -6); samples are the measured deck-top heights along the
   model (t = 0 west end, 1 east). v0.2.9: the span is STRETCHED along
   X only — scaleX 9.676 = 8.2 x 1.18, scaleY/Z stay 8.2 — because at
   8.03 m the west tip floated past the launch shelf edge; stretched
   to 9.48 m it lands ON the shelf (mesh span 1.58..11.06). The deck
   ends differ (0.090 west vs 0.105 east local), so the group is
   pitched by tilt = atan(-(0.105 - 0.090) * scaleY / (0.98 * scaleX))
   = atan(-0.123 / 9.48248) = -0.012971 rad, and baseY = 12.4806 (the
   ends-solve barely moves with the stretch) puts BOTH deck ends at
   world y = 13.28 and the sagging middle at ~12.73. (v0.2.8: raised
   +0.38 from the original 12.1006 — a rock rib under the span at
   x 5.1-6.9 reads up to 12.74 on the heightmap and pierced the old
   deck line. Re-verified for the stretched profile in v0.2.9: the
   deck still clears the rib everywhere along the strip, min margin
   +0.053 at x=6.2. The deck steps DOWN ~0.37 onto the end disc
   (12.90) at the east seam and 0.15 down to the launch shelf (13.13)
   at the west — both inside the 0.65 rise gate.) */
const BRIDGE = {
  cx: 6.32, cz: -6.0, scaleX: 9.676, scaleY: 8.2, baseY: 12.4806, tilt: -0.012971,
  x0: 1.58, x1: 11.06,   // mesh span: cx -+ 0.49 * scaleX = 1.579..11.061
  groundX1: 10.40,      // ground strip still ends at the END_DISC edge
                        // (11.5 - 1.1) although the stretched mesh
                        // overshoots to 11.06 and lands on the Buddha
                        // rock; the END_DISC check takes over at 12.90 —
                        // a deliberate ~0.37 step down, inside the gate
  hw: 1.05,             // walkable half-width of the deck strip
  samples: [
    [0.03, 0.090], [0.10, 0.104], [0.16, 0.106], [0.23, 0.099], [0.30, 0.072],
    [0.37, 0.052], [0.43, 0.042], [0.50, 0.031], [0.57, 0.034], [0.63, 0.044],
    [0.70, 0.055], [0.77, 0.076], [0.84, 0.088], [0.90, 0.101], [0.97, 0.105],
  ],
};
const END_DISC = { x: 11.5, z: -6.0, y: 12.9, r: 1.1 };
/* Buddha point layout (v0.2.11, Anita): statue x1.5 at the back-RIGHT
   corner, the one candle cluster shrunk at the back-LEFT. Her corner
   (~(12.10, -6.75)) is OFF the mini island: measured on the real
   heightmap, the island's south rim ends at z ~ -6.7 and the target
   centre itself has NO surface (the base disc would hang ~30% over
   the void, footprint height range > 1.2 m everywhere in that zone).
   The statue therefore sits at the gentlest fully-supported spot on
   the same (back, -z) side: base centre on the flat apron band,
   rendered surface 12.952, viewer-side float <= 0.08, the peak rising
   behind its back rim like a niche. Full evidence: vn-harness5/run9. */
const BUDDHA_POS = { x: 11.85, z: -6.10 };
/* Miniature-island pose (set on the buddhaRock group in the build
   section; kept here as the single source for miniSurfaceY). */
const BUDDHA_ROCK_POSE = { x: 12.175, y: 12.271, z: -5.25, rotY: -Math.PI / 2 };
/* Rendered surface height of the miniature island at world (x, z) —
   the same identity the offline harness verifies through the group's
   world matrix: island coords = rock-local x (40/3) (the mini runs
   the island model at x3, the main island at x40, apron 0.203 ->
   island y 0 via y -8.12); rendered = poseY + 0.075 * H + 0.609.
   Returns null where the island has no surface. */
function miniSurfaceY(x, z) {
  const dx = x - BUDDHA_ROCK_POSE.x, dz = z - BUDDHA_ROCK_POSE.z;
  const c = Math.cos(BUDDHA_ROCK_POSE.rotY), s = Math.sin(BUDDHA_ROCK_POSE.rotY);
  const lx = c * dx - s * dz, lz = s * dx + c * dz;
  const h = sampleGround(lx * (40 / 3), lz * (40 / 3));
  return h === null ? null : BUDDHA_ROCK_POSE.y + 0.075 * h + 0.609;
}
/* Mouth filler disc (v0.2.8, ground-only, no visual): a groove crosses
   the straight route at the bridge mouth — terrain at x~2.25, z=-6
   dips to 11.86 while the launch shelf reads ~13.13 and the (raised)
   deck starts at 13.28, a >1.0 cliff in ground terms that stalled a
   straight tap toward the bridge. This flat disc spans the groove so
   the centreline reads shelf ~13.13 -> filler 13.20 -> deck 13.28.
   Rim audit vs the heightmap (12-point ring): the worst terrain under
   the rim is 11.635 (drop 1.565 from the disc top, inside the 1.6
   allowance) — the disc only bridges the shallow groove, it never
   spans open air over the deep drop. */
const MOUTH_DISC = { x: 1.95, z: -6.0, y: 13.20, r: 0.85 };
/* Deck-top height (world y) of the bridge at a world x: lerp the
   measured profile (t mapped through scaleX), then apply the same
   scales + tilt + baseY as the mesh group transform — heights run
   through scaleY, the along-span tilt lever through scaleX. */
function deckYAt(worldX) {
  const xl = (worldX - BRIDGE.cx) / BRIDGE.scaleX;
  let t = (xl + 0.49) / 0.98;
  t = Math.min(1, Math.max(0, t));
  const s = BRIDGE.samples;
  let dy = s[s.length - 1][1];
  if (t <= s[0][0]) dy = s[0][1];
  else {
    for (let i = 1; i < s.length; i++) {
      if (t <= s[i][0]) {
        dy = s[i - 1][1] + (s[i][1] - s[i - 1][1]) * (t - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
        break;
      }
    }
  }
  return BRIDGE.baseY
    + xl * BRIDGE.scaleX * Math.sin(BRIDGE.tilt)
    + dy * BRIDGE.scaleY * Math.cos(BRIDGE.tilt);
}

/* Heightmap decode (data in heightmap.js): done up here, before any
   building, so placement code can sample the real surface immediately. */
const HMAP_SENTINEL = -999;
let hmapData = null, HMAP_N = 0, HMAP_MIN = 0, HMAP_CELL = 1;
try {

/* ================= Canvas textures (no custom shaders) ================= */
function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); return t;
}
const glowTex = radialTex(128, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const cloudTex = radialTex(256, [[0, 'rgba(255,255,255,0.95)'], [0.45, 'rgba(255,255,255,0.55)'], [0.75, 'rgba(255,255,255,0.18)'], [1, 'rgba(255,255,255,0)']]);

function skyTexture() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0.0, '#5f96d6');
  gr.addColorStop(0.38, '#8fb8e8');
  gr.addColorStop(0.60, '#c3d9f0');
  gr.addColorStop(0.74, '#eef0e6');
  gr.addColorStop(0.82, '#f7ead0');
  gr.addColorStop(0.88, '#d9c9a8');
  gr.addColorStop(1.0, '#b8a888');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= Loading progress (v0.2.12) =================
   One shared LoadingManager drives the small "Đang tải cảnh… NN%"
   pill. It updates per finished item, and hides when every item has
   ended — an item that errors still ends, so onLoad fires and the
   pill goes away even on a failed model. A hard timeout removes it
   regardless; it never blocks input (pointer-events: none). */
const loadPctEl = document.getElementById('loadPct');
let loadPctDone = false;
function hideLoadPct() {
  if (loadPctDone) return; loadPctDone = true;
  if (!loadPctEl) return;
  loadPctEl.style.opacity = '0';
  setTimeout(() => { if (loadPctEl) loadPctEl.remove(); }, 500);
}
const loadMgr = new THREE.LoadingManager();
loadMgr.onProgress = (url, loaded, total) => {
  if (loadPctEl && !loadPctDone && total > 0)
    loadPctEl.textContent = 'Đang tải cảnh… ' + Math.round(100 * loaded / total) + '%';
};
loadMgr.onLoad = hideLoadPct;
setTimeout(hideLoadPct, 120000);

/* ================= Island build ================= */
function addMesh(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
{ // the real mountain: 'rocky mountain' (lotmv5), compressed for the web.
  // Scale x40 (island 40 m wide); apron band model y 0.203 -> world y 0, so
  // the diorama bottom sits ~8.1 m below the apron, inside the cloud sea.
  // v0.2.12: the model is fetched/parsed ONCE — the Buddha rock further
  // down is a clone(true) of this same scene (shared geometry and
  // materials, its own transform), not a second 6 MB download.
  new GLTFLoader(loadMgr).load('models/mountain.glb', (gltf) => {
    const g = gltf.scene;
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.scale.setScalar(40);
    g.position.set(0, -8.12, 0);
    scene.add(g);
    const mini = g.clone(true);
    mini.scale.setScalar(3.0);
    buddhaRock.add(mini);
  }, undefined, () => {});
}
{ // the real stone rope bridge + end rock point
  bridgeGroup = new THREE.Group();
  bridgeGroup.position.set(BRIDGE.cx, BRIDGE.baseY, BRIDGE.cz);
  bridgeGroup.rotation.z = BRIDGE.tilt;
  scene.add(bridgeGroup);
  new GLTFLoader(loadMgr).load('models/bridge.glb', (gltf) => {
    const m = gltf.scene;
    m.scale.set(BRIDGE.scaleX, BRIDGE.scaleY, BRIDGE.scaleY); // X stretched x1.18 (v0.2.9); Y/Z stay 8.2
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    bridgeGroup.add(m);
  }, undefined, () => {});
  /* Buddha rock (v0.2.9): the fake grey disc + support cone are gone.
     The rock point is the island model itself, reused at miniature
     scale (3.0 = 7.5% of the main island's x40), so the statue, the
     single candle cluster and the player's bow spot keep standing at
     the END_DISC top (12.90), now on real rock.
     Pose (v0.2.10, Anita: the peak cluster blocked the way in from the
     bridge): rotation.y = -pi/2 with the group shifted so the island's
     big FLAT WEST APRON — heightmap point (-10, 9), H = 0.262 — maps
     onto the disc centre. The flat apron now faces the bridge (way in
     open: rendered surface along the z=-6 line stays <= 12.90) and
     the island's peak stands EAST as a backdrop behind the Buddha
     (backdrop strip renders ~13.36 mean). Group y = 12.90 - 0.609
     - 0.075 * H(-10, 9) = 12.271, so the apron surface lands exactly
     on the disc top at the centre; statue/candle/bow spots render
     12.85..12.96 (planted, never floating).
     Only the visual changed — groundAt's END_DISC branch is untouched. */
  buddhaRock = new THREE.Group();
  buddhaRock.position.set(BUDDHA_ROCK_POSE.x, BUDDHA_ROCK_POSE.y, BUDDHA_ROCK_POSE.z);
  buddhaRock.rotation.y = BUDDHA_ROCK_POSE.rotY;
  scene.add(buddhaRock);
  // The rock mesh itself arrives with the single mountain load above
  // (v0.2.12): that callback clones the loaded scene into this group
  // at scale 3.0. buddhaRock is assigned during module evaluation,
  // before any load can complete, so the clone always finds it ready.
}
{ // real Buddha statue at the bridge end, facing back west (-X) toward the bridge
  // v0.2.11: x1.5 (1.5 m tall), moved to BUDDHA_POS (back-right corner
  // area — see the layout note at the constant), base planted on the

  bodyG.rotation.z = Math.sin(walkPhase) * 0.02 * walkBlend + sway;
  bodyG.rotation.x = (0.03 + Math.min(speed, 3) * 0.01) * walkBlend;

  // Xa (greeting bow): the upper pivot dips 0.34 rad over ~1.05 s.
  if (animState === 'xa') {
    animT += dt;
    if (animT >= 1.05) { if (upperG) upperG.rotation.x = 0; animState = 'idle'; }
    else if (upperG) {
      const a = animT < 0.35 ? smooth01(animT / 0.35) : (animT < 0.6 ? 1 : 1 - smooth01((animT - 0.6) / 0.45));
      upperG.rotation.x = XA_PITCH * a;
    }
  }

  // Temple-pattern bow: ENTER eases into the low held posture (scale.y
  // 0.78, the seated value) as the kneel base; three bows are then pure
  // upper-body pitch (0.55) from that base — the scale never changes per
  // bow; EXIT stands back up. (The v0.2.3 squash-and-plunge is gone.)
  if (animState === 'bow') {
    bowT += dt;
    if (bowPhase === 'enter') {
      bowScale = 1 + (SEAT_SQ - 1) * smooth01(bowT / 0.5);
      if (bowT >= 0.5) {
        bowScale = SEAT_SQ; bowPhase = 'down'; bowT = 0;
        bowChip.textContent = '🙏 ' + (bowCount + 1) + '/3';
      }
    } else if (bowPhase === 'down') {
      bowPitch = BOW_PITCH * smooth01(bowT / 0.6);
      if (bowT >= 0.6) { bowPitch = BOW_PITCH; bowPhase = 'hold'; bowT = 0; }
    } else if (bowPhase === 'hold') {
      if (bowT >= 0.3) { bowPhase = 'up'; bowT = 0; }
    } else if (bowPhase === 'up') {
      bowPitch = BOW_PITCH * (1 - smooth01(bowT / 0.6));
      if (bowT >= 0.6) { bowPitch = 0; bowPhase = 'pause'; bowT = 0; }
    } else if (bowPhase === 'pause') {
      if (bowT >= 0.25) {
        bowCount++;
        if (bowCount >= 3) { bowPhase = 'exit'; bowT = 0; bowExitDur = 0.5; bowPitch0 = bowPitch; }
        else { bowPhase = 'down'; bowT = 0; bowChip.textContent = '🙏 ' + (bowCount + 1) + '/3'; }
      }
    } else if (bowPhase === 'exit') {
      const p = smooth01(bowT / bowExitDur);
      bowScale = SEAT_SQ + (1 - SEAT_SQ) * p;
      bowPitch = bowPitch0 * (1 - p);
      if (bowT >= bowExitDur) {
        bowScale = 1; bowPitch = 0; animState = 'idle';
        bowChip.textContent = '🙏 Lạy';
      }
    }
    if (upperG) upperG.rotation.x = bowPitch;
  }

  // Recover (a xa cancelled by walking): ease the upper body to neutral.
  if (animState === 'recover') {
    animT += dt;
    const k = smooth01(animT / recDur);
    if (upperG) upperG.rotation.x = recXa0 * (1 - k);
    if (animT >= recDur) { if (upperG) upperG.rotation.x = 0; animState = 'idle'; }
  }

  // Apply the bow scale; idle breathing rides on the same scale.
  let sy = bowScale;
  if (animState === 'idle' && stillT > 1) sy *= 1 + Math.sin(t * 1.4) * 0.006;
  bodyG.scale.y = sy;

  // Arriving at the Buddha, once per visit: a greeting xa.
  const onEnd = Math.hypot(player.position.x - END_DISC.x, player.position.z - END_DISC.z) <= END_DISC.r;
  if (onEnd && !onEndPrev && animState === 'idle') {
    faceTarget = Math.atan2(BUDDHA_POS.x - player.position.x, BUDDHA_POS.z - player.position.z);
    startXa();
  }
  onEndPrev = onEnd;
}
function updateChip() {
  const d = Math.hypot(player.position.x - END_DISC.x, player.position.z - END_DISC.z);
  if (d > 1.9) { bowChip.style.display = 'none'; return; }
  projV.set(END_DISC.x, END_DISC.y + 1.75, END_DISC.z).project(camera);
  if (projV.z > 1) { bowChip.style.display = 'none'; return; }
  bowChip.style.display = 'block';
  bowChip.style.left = ((projV.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  bowChip.style.top = ((-projV.y * 0.5 + 0.5) * window.innerHeight) + 'px';
}
/* Follow camera: while the player is driven by the arrow KEYS (never by
   tap-to-walk), ease the camera behind the avatar's heading at polar 1.12,
   keeping her current distance (clamped 3..8). A manual orbit drag
   suspends it; it resumes when key-driving continues after the hold. */
function followCamera(dt) {
  if (!keys.fwd && !keys.left && !keys.right) return;
  if (animLocked() || camOrbiting) return;
  if (clock.elapsedTime < camManualUntil) return;
  camOff.copy(camera.position).sub(controls.target);
  camSph.setFromVector3(camOff);
  const wantTheta = player.rotation.y + Math.PI;
  const dTheta = Math.atan2(Math.sin(wantTheta - camSph.theta), Math.cos(wantTheta - camSph.theta));
  const wantRadius = Math.min(8, Math.max(3, camSph.radius));
  const k = 1 - Math.exp(-3.5 * dt);
  camSph.theta += dTheta * k;
  camSph.phi += (1.12 - camSph.phi) * k;
  camSph.radius += (wantRadius - camSph.radius) * k;
  camera.position.copy(controls.target).add(camOff.setFromSpherical(camSph));
}

/* Session resume: snapshot the run so a refresh does not lose the climb. */
function vnStore() {
  // v0.2.6: localStorage — sessionStorage did not survive a refresh in
  // Anita's in-app browser, which cost the restored run.
  try { return window.localStorage || null; } catch (e) { return null; }
}
function vnLegacyStore() {
  try { return window.sessionStorage || null; } catch (e) { return null; }
}
function saveSession() {
  const s = vnStore(); if (!s || !player) return;
  try {
    s.setItem('vn-session', JSON.stringify({
      x: player.position.x, z: player.position.z, ry: player.rotation.y,
      cx: camera.position.x, cy: camera.position.y, cz: camera.position.z,
      t: Date.now(),
    }));
  } catch (e) {}
}
window.addEventListener('beforeunload', saveSession);
window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveSession();
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  if (t - vnSaveT >= 1) { vnSaveT = t; saveSession(); }
  if (!animLocked()) movePlayer(dt);
  rideGround(dt);
  updateAnim(dt, t);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 115) c.position.x = -115;
  }
  for (const L of lampGlows) {
    L.mat.opacity = 0.55 + 0.13 * Math.sin(t * 11 + L.phase) + 0.05 * Math.sin(t * 23 + L.phase * 2);
    const fs = L.base * (1 + 0.06 * Math.sin(t * 9 + L.phase * 1.3));
    L.sprite.scale.set(fs, fs, 1);
  }
  // camera target follows the avatar; camera rides along by the same delta
  camTmp.set(player.position.x, player.position.y + 1.0, player.position.z);
  camDelta.copy(camTmp).sub(controls.target).multiplyScalar(Math.min(1, 5 * dt));
  controls.target.add(camDelta);
  camera.position.add(camDelta);
  followCamera(dt);
  controls.update();
  updateChip();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    bootMark('frame-1');
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
  }
}
/* Offline-harness hooks (no effect in normal use). */
window.__vn = {
  get player() { return player; }, get bodyG() { return bodyG; },
  get upperG() { return upperG; }, get bowGroup() { return bowGroup; },
  get state() { return animState; }, get bowPhase() { return bowPhase; },
  get bowPitch() { return bowPitch; }, get bowScale() { return bowScale; },
  get walkBlend() { return walkBlend; },
  chip: bowChip, scene: () => scene,
  lamps: () => lampGroups, lampGlows: () => lampGlows,
  startXa, startBow, sampleGround, groundAt, deckYAt, miniSurfaceY,
  bridge: () => bridgeGroup, bridgeData: () => BRIDGE, mouthDisc: () => MOUTH_DISC,
  buddhaRock: () => buddhaRock, endDisc: () => END_DISC,
  buddha: () => buddhaGroup, buddhaPos: () => BUDDHA_POS,
  get faceTarget() { return faceTarget; },
  setWalk: (x, z) => { walkTarget = new THREE.Vector3(x, 0, z); },
  keys,
  camera: () => camera, controls: () => controls,
  get camManualUntil() { return camManualUntil; },
  get camOrbiting() { return camOrbiting; },
  saveSession,
};
animate();
</script>
</body>
