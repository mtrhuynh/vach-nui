/* Safety net: if the 3D module cannot start, never leave the visitor on the
   loading screen — after 25 s show a reload hint on the loading card itself. */
setTimeout(function () {
  var ld = document.getElementById('loading');
  if (ld) ld.innerHTML = '<div class="spin">🪷</div><div>Đang tải lâu hơn thường lệ…<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 22px;border-radius:999px;border:0;background:#c9a45c;color:#241708;font-weight:700;font-size:15px">↻ Tải lại trang</button></div>';

<script>
/* Boot diagnostics: records boot stages + the last error; the loading card
   only shows the trace when an error exists. */
window.__boot = []; window.__bootErr = '';
window.bootMark = function (s) { window.__boot.push(s); };
window.addEventListener('error', function (e) {
  window.__bootErr = 'ERR: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__bootErr = 'REJECT: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
setInterval(function () {
  var ld = document.getElementById('loading'); if (!ld) return;
  var t = document.getElementById('bootTrace'); if (!t) return;
  var txt = window.__bootErr ? ((window.__boot.length ? window.__boot.join(' > ') : 'module chua chay') + ' || ' + window.__bootErr) : '';
  if (t.textContent !== txt) t.textContent = txt;
}, 600);
</script>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const bootMark = window.bootMark || function () {};
bootMark('imports-ok');

const VN_VER = '0.2.1';

/* ================= World layout data (built geometry) =================
   The island is models/mountain.glb scaled x40, wrap y=-8.12 (apron band,
   model y 0.203, sits near world y=0). Terrain height/walkability comes
   from heightmap.js — a ray-cast bake of the real mesh (see Ground model).
   Only the built additions keep analytic ground: the plank and its end
   disc. The plank launches EAST from the highest terrace (mesh band
   0.526, surface ~13.1-13.4 at z=-6); its west end is anchored at x=1.5,
   where the terrace rock still stands at 12.45-13.05 across the plank's
   mouth band, so stepping onto the 12.9 plank costs at most 0.45 m of
   rise. East of x~1.75 the mesh shoulder dips to ~11.6 — the old x=3.5
   start floated 1.2 m above the last walkable rock there, and no rise
   gate could ever step onto it. */
const PLANK = { x0: 1.5, x1: 10.5, z: -6.0, y: 12.9, hw: 0.35 };
const END_DISC = { x: 11.5, z: -6.0, y: 12.9, r: 1.1 };

/* ================= Canvas textures (no custom shaders) ================= */
function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); return t;
}
const glowTex = radialTex(128, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const cloudTex = radialTex(256, [[0, 'rgba(255,255,255,0.95)'], [0.45, 'rgba(255,255,255,0.55)'], [0.75, 'rgba(255,255,255,0.18)'], [1, 'rgba(255,255,255,0)']]);

function skyTexture() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0.0, '#5f96d6');
  gr.addColorStop(0.38, '#8fb8e8');
  gr.addColorStop(0.60, '#c3d9f0');
  gr.addColorStop(0.74, '#eef0e6');
  gr.addColorStop(0.82, '#f7ead0');
  gr.addColorStop(0.88, '#d9c9a8');
  gr.addColorStop(1.0, '#b8a888');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= Sky, lights ================= */

/* ================= Materials ================= */

/* ================= Island build ================= */
function addMesh(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
{ // the real mountain: 'rocky mountain' (lotmv5), compressed for the web.
  // Scale x40 (island 40 m wide); apron band model y 0.203 -> world y 0, so
  // the diorama bottom sits ~8.1 m below the apron, inside the cloud sea.
  new GLTFLoader().load('models/mountain.glb', (gltf) => {
    const g = gltf.scene;
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.scale.setScalar(40);
    g.position.set(0, -8.12, 0);
    scene.add(g);
  });
}
{ // plank + struts + chain rail + end rock point
  const plank = addMesh(new THREE.BoxGeometry(PLANK.x1 - PLANK.x0, 0.12, 0.7), MAT.wood, (PLANK.x0 + PLANK.x1) / 2, PLANK.y - 0.06, PLANK.z);

  for (const px of [PLANK.x0 + 1.2, (PLANK.x0 + PLANK.x1) / 2, PLANK.x1 - 1.0]) {

  }
  const rail = new THREE.Line(new THREE.BufferGeometry().setFromPoints(railPts), MAT.chain);
  scene.add(rail);
  addMesh(new THREE.CylinderGeometry(END_DISC.r, END_DISC.r * 1.25, 0.6, 18), MAT.discTop, END_DISC.x, END_DISC.y - 0.3, END_DISC.z);
  const lump = addMesh(new THREE.ConeGeometry(1.15, 3.6, 8), MAT.rock, END_DISC.x, END_DISC.y - 2.2, END_DISC.z);
  lump.rotation.x = Math.PI;
}
{ // small gold Buddha placeholder at the plank end, facing back west (-X)

/* ================= Ground model: baked heightmap of the real mesh ======
   heightmap.js (loaded before this module) carries window.VN_HMAP: a
   164x164 grid over x,z in [-20.5, 20.5] at 0.25 m cells, baked offline by
   casting rays down onto models/mountain.glb in world transform (scale
   x40, y -8.12) and keeping the highest hit per cell; -999 = no surface.
   The mesh surface is lumpy rock (the apron alone spans ~2.4 m of relief),
   so flat analytic discs made the avatar sink into the visual terrain —
   the sampler is now the single source of truth for terrain height. */
const HMAP_SENTINEL = -999;
let hmapData = null, HMAP_N = 0, HMAP_MIN = 0, HMAP_CELL = 1;
try {
  const H = window.VN_HMAP;
  if (H && H.data) {
    const bin = atob(H.data);
    const buf = new ArrayBuffer(bin.length);
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    hmapData = new Float32Array(buf);
    HMAP_N = H.n; HMAP_MIN = H.min; HMAP_CELL = H.cell;
  }
} catch (e) { hmapData = null; }
function sampleGround(x, z) {
  if (!hmapData) return null;
  const gx = (x - HMAP_MIN) / HMAP_CELL - 0.5;
  const gz = (z - HMAP_MIN) / HMAP_CELL - 0.5;
  if (gx < 0 || gz < 0 || gx > HMAP_N - 1 || gz > HMAP_N - 1) return null;
  const i0 = Math.floor(gx), j0 = Math.floor(gz);
  const i1 = Math.min(i0 + 1, HMAP_N - 1), j1 = Math.min(j0 + 1, HMAP_N - 1);
  const fx = gx - i0, fz = gz - j0;
  const a = hmapData[j0 * HMAP_N + i0], b = hmapData[j0 * HMAP_N + i1];
  const c = hmapData[j1 * HMAP_N + i0], d = hmapData[j1 * HMAP_N + i1];
  if (a === HMAP_SENTINEL || b === HMAP_SENTINEL || c === HMAP_SENTINEL || d === HMAP_SENTINEL) return null;
  return (a * (1 - fx) + b * fx) * (1 - fz) + (c * (1 - fx) + d * fx) * fz;
}
/* Ground height at (x,z): built geometry wins over the terrain sampler. */
function groundAt(x, z) {
  if (Math.hypot(x - END_DISC.x, z - END_DISC.z) <= END_DISC.r) return END_DISC.y;
  if (x >= PLANK.x0 && x <= PLANK.x1 && Math.abs(z - PLANK.z) <= PLANK.hw) return PLANK.y;
  return sampleGround(x, z);
}
/* Rise gate: refuse a move whose ground rise exceeds the gate (axis-slide
   fallback lives in movePlayer). This is what stops cliff-climbing: the
   mesh's real ramps rise gradually, its walls jump metres per step.
   Gate is 0.65, not 0.5: the first rock step of the climb (apron shelf
   ~0.87 -> plateau ~4.45 at z~7.3, on the spawn's straight line north)
   needs 0.61 per 60 fps step head-on. The terrace-2 riser at z~0.5 needs
   0.66 head-on, so it stays gated on the meridian and is crossed
   obliquely via the ramp corridor, as the tap-walk route does. */
const RISE_GATE = 0.65;
function canStep(curY, nxtY) {
  return nxtY !== null && Math.abs(nxtY - curY) <= RISE_GATE;
}
function nearestWalkable(px, pz) {
  if (groundAt(px, pz) !== null) return { x: px, z: pz };
  for (let r = 0.4; r <= 7.001; r += 0.4) {
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * Math.PI * 2;
      const cx = px + Math.cos(a) * r, cz = pz + Math.sin(a) * r;
      if (groundAt(cx, cz) !== null) return { x: cx, z: cz };
    }
  }
  return null;
}

/* ================= Input: tap-to-walk + arrow keys ================= */
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6 || performance.now() - downT > 450) return;
  const curY = groundAt(player.position.x, player.position.z);
  tapPlane.constant = -(curY !== null ? curY : player.position.y);
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (!raycaster.ray.intersectPlane(tapPlane, tapPoint)) return;
  let tx = tapPoint.x, tz = tapPoint.z;
  if (groundAt(tx, tz) === null) {
    const snap = nearestWalkable(tx, tz);
    if (!snap) return;
    tx = snap.x; tz = snap.z;
  }
  walkTarget = new THREE.Vector3(tx, 0, tz);
});
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'ArrowUp') { keys.fwd = true; walkTarget = null; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') keys.left = true;
  else if (e.key === 'ArrowRight') keys.right = true;
  else if (e.key === 'ArrowDown') { faceTarget = player.rotation.y + Math.PI; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp') keys.fwd = false;
  else if (e.key === 'ArrowLeft') keys.left = false;
  else if (e.key === 'ArrowRight') keys.right = false;
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
bowChip.addEventListener('click', () => {
  if (bowing) return;
  faceTarget = Math.atan2(BUDDHA_POS.x - player.position.x, BUDDHA_POS.z - player.position.z);
  bowing = true; bowT = 0;
});

/* ================= Per-frame updates ================= */
function movePlayer(dt) {
  if (keys.left) player.rotation.y += 2.2 * dt;
  if (keys.right) player.rotation.y -= 2.2 * dt;
  let mx = 0, mz = 0;
  if (keys.fwd) {
    mx = Math.sin(player.rotation.y); mz = Math.cos(player.rotation.y);
  } else if (walkTarget) {
    const dx = walkTarget.x - player.position.x, dz = walkTarget.z - player.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.08) { walkTarget = null; }
    else {
      mx = dx / dist; mz = dz / dist;
      const want = Math.atan2(dx, dz);
      let diff = want - player.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.rotation.y += diff * Math.min(1, 10 * dt);
    }
  }
  if (faceTarget !== null && !walkTarget && !keys.fwd) {
    let diff = faceTarget - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * Math.min(1, 8 * dt);
    if (Math.abs(diff) < 0.02) faceTarget = null;
  }
  if (mx !== 0 || mz !== 0) {
    const step = Math.min(2.6 * dt, walkTarget ? Math.hypot(walkTarget.x - player.position.x, walkTarget.z - player.position.z) : 2.6 * dt);
    const curY = groundAt(player.position.x, player.position.z);
    const baseY = curY !== null ? curY : player.position.y;
    const nx = player.position.x + mx * step, nz = player.position.z + mz * step;
    if (canStep(baseY, groundAt(nx, nz))) { player.position.x = nx; player.position.z = nz; }
    else if (canStep(baseY, groundAt(nx, player.position.z))) { player.position.x = nx; }
    else if (canStep(baseY, groundAt(player.position.x, nz))) { player.position.z = nz; }
    else if (walkTarget) walkTarget = null;
  }
  // Avatar rides the sampled surface exactly (no sinking into the lumps);
  // only a big step (built geometry transitions) is smoothed with a lerp.
  const gy = groundAt(player.position.x, player.position.z);
  if (gy !== null) {
    const dy = gy - player.position.y;
    if (Math.abs(dy) <= 0.45) player.position.y = gy;
    else player.position.y += dy * Math.min(1, 14 * dt);
  }
}
function updateBow(dt) {
  if (!upperG) return;
  if (bowing) {
    bowT += dt;
    const T = 1.6;
    if (bowT >= T) { bowing = false; upperG.rotation.x = 0; }
    else {
      const p = bowT / T;
      const a = p < 0.44 ? (p / 0.44) : (p < 0.56 ? 1 : 1 - (p - 0.56) / 0.44);
      upperG.rotation.x = 0.6 * a * a * (3 - 2 * a);
    }
  }
}
function updateChip() {
  const d = Math.hypot(player.position.x - END_DISC.x, player.position.z - END_DISC.z);
  if (d > 1.9) { bowChip.style.display = 'none'; return; }
  projV.set(END_DISC.x, END_DISC.y + 1.75, END_DISC.z).project(camera);
  if (projV.z > 1) { bowChip.style.display = 'none'; return; }
  bowChip.style.display = 'block';
  bowChip.style.left = ((projV.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  bowChip.style.top = ((-projV.y * 0.5 + 0.5) * window.innerHeight) + 'px';
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  movePlayer(dt);
  updateBow(dt);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 115) c.position.x = -115;
  }
  // camera target follows the avatar; camera rides along by the same delta
  camTmp.set(player.position.x, player.position.y + 1.0, player.position.z);
  camDelta.copy(camTmp).sub(controls.target).multiplyScalar(Math.min(1, 5 * dt));
  controls.target.add(camDelta);
  camera.position.add(camDelta);
  controls.update();
  updateChip();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    bootMark('frame-1');
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
  }
}
animate();
</script>
</body>
