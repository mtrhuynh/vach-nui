<script>
/* Boot diagnostics: records boot stages + the last error; the loading card
   only shows the trace when an error exists. */
window.__boot = []; window.__bootErr = '';
window.bootMark = function (s) { window.__boot.push(s); };
window.addEventListener('error', function (e) {
  window.__bootErr = 'ERR: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__bootErr = 'REJECT: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
setInterval(function () {
  var ld = document.getElementById('loading'); if (!ld) return;
  var t = document.getElementById('bootTrace'); if (!t) return;
  var txt = window.__bootErr ? ((window.__boot.length ? window.__boot.join(' > ') : 'module chua chay') + ' || ' + window.__bootErr) : '';
  if (t.textContent !== txt) t.textContent = txt;
}, 600);
</script>

function radialTex(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); return t;
}

  const c = document.createElement('canvas'); c.width = 4; c.height = 512;

  gr.addColorStop(0.74, '#eef0e6');

  gr.addColorStop(0.88, '#d9c9a8');

  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= Island build ================= */
function addMesh(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}
{ // the real mountain: 'rocky mountain' (lotmv5), compressed for the web.

  new GLTFLoader().load('models/mountain.glb', (gltf) => {
    const g = gltf.scene;
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

{ // plank + struts + chain rail + end rock point

/* ================= Ground model ================= */
function groundInfo(x, z) {
  const de = Math.hypot(x - END_DISC.x, z - END_DISC.z);
  if (de <= END_DISC.r) return { y: END_DISC.y, zone: 'end', idx: 5 };
  if (x >= PLANK.x0 && x <= PLANK.x1 && Math.abs(z - PLANK.z) <= PLANK.hw) return { y: PLANK.y, zone: 'plank', idx: 5 };
  let best = null;
  for (let i = 0; i < DISCS.length; i++) {
    const d = DISCS[i];
    if (Math.hypot(x - d.x, z - d.z) <= d.r && (!best || d.y > best.y)) best = { y: d.y, zone: 'disc', idx: i };
  }
  if (best) return best;
  if (Math.hypot(x, z) <= APRON_R && z >= APRON_ZMIN) return { y: 0, zone: 'apron', idx: -1 };
  return null;
}
function canStep(cur, nxt) {
  if (!nxt) return false;
  const dy = Math.abs(nxt.y - cur.y);
  if (dy <= 0.5) return true;
  if (cur.zone === 'disc' && nxt.zone === 'disc' && Math.abs(cur.idx - nxt.idx) <= 1) return true;
  return false;
}
function nearestWalkable(px, pz) {
  let bestP = null, bestD = 7;
  const consider = (cx, cz) => {
    const info = groundInfo(cx, cz);
    if (!info) return;
    const d = Math.hypot(cx - px, cz - pz);
    if (d < bestD) { bestD = d; bestP = { x: cx, z: cz }; }
  };
  for (const d of DISCS) {
    const dx = px - d.x, dz = pz - d.z, dist = Math.hypot(dx, dz);
    if (dist <= d.r) consider(px, pz);
    else consider(d.x + dx / dist * d.r * 0.92, d.z + dz / dist * d.r * 0.92);
  }
  consider(THREE.MathUtils.clamp(px, PLANK.x0, PLANK.x1), PLANK.z);
  {
    const d = Math.hypot(px - END_DISC.x, pz - END_DISC.z);
    if (d > END_DISC.r) consider(END_DISC.x + (px - END_DISC.x) / d * END_DISC.r * 0.9, END_DISC.z + (pz - END_DISC.z) / d * END_DISC.r * 0.9);
    else consider(px, pz);
  }
  {
    const d = Math.hypot(px, pz);
    let ax = px, az = Math.max(pz, APRON_ZMIN + 0.2);
    if (d > APRON_R) { ax = px / d * APRON_R; az = Math.max(pz / d * APRON_R, APRON_ZMIN + 0.2); }
    consider(ax, az);
  }
  return bestP;
}

/* ================= Input: tap-to-walk + arrow keys ================= */
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6 || performance.now() - downT > 450) return;
  const cur = groundInfo(player.position.x, player.position.z);
  tapPlane.constant = -(cur ? cur.y : player.position.y);
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (!raycaster.ray.intersectPlane(tapPlane, tapPoint)) return;
  let tx = tapPoint.x, tz = tapPoint.z;
  if (!groundInfo(tx, tz)) {
    const snap = nearestWalkable(tx, tz);
    if (!snap) return;
    tx = snap.x; tz = snap.z;
  }
  walkTarget = new THREE.Vector3(tx, 0, tz);
});
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'ArrowUp') { keys.fwd = true; walkTarget = null; e.preventDefault(); }
  else if (e.key === 'ArrowLeft') keys.left = true;
  else if (e.key === 'ArrowRight') keys.right = true;
  else if (e.key === 'ArrowDown') { faceTarget = player.rotation.y + Math.PI; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp') keys.fwd = false;
  else if (e.key === 'ArrowLeft') keys.left = false;
  else if (e.key === 'ArrowRight') keys.right = false;
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
bowChip.addEventListener('click', () => {
  if (bowing) return;
  faceTarget = Math.atan2(BUDDHA_POS.x - player.position.x, BUDDHA_POS.z - player.position.z);
  bowing = true; bowT = 0;
});

/* ================= Per-frame updates ================= */
function movePlayer(dt) {
  if (keys.left) player.rotation.y += 2.2 * dt;
  if (keys.right) player.rotation.y -= 2.2 * dt;
  let mx = 0, mz = 0;
  if (keys.fwd) {
    mx = Math.sin(player.rotation.y); mz = Math.cos(player.rotation.y);
  } else if (walkTarget) {
    const dx = walkTarget.x - player.position.x, dz = walkTarget.z - player.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.08) { walkTarget = null; }
    else {
      mx = dx / dist; mz = dz / dist;
      const want = Math.atan2(dx, dz);
      let diff = want - player.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.rotation.y += diff * Math.min(1, 10 * dt);
    }
  }
  if (faceTarget !== null && !walkTarget && !keys.fwd) {
    let diff = faceTarget - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * Math.min(1, 8 * dt);
    if (Math.abs(diff) < 0.02) faceTarget = null;
  }
  if (mx !== 0 || mz !== 0) {
    const step = Math.min(2.6 * dt, walkTarget ? Math.hypot(walkTarget.x - player.position.x, walkTarget.z - player.position.z) : 2.6 * dt);
    const cur = groundInfo(player.position.x, player.position.z) || { y: player.position.y, zone: 'apron', idx: -1 };
    const nx = player.position.x + mx * step, nz = player.position.z + mz * step;
    if (canStep(cur, groundInfo(nx, nz))) { player.position.x = nx; player.position.z = nz; }
    else if (canStep(cur, groundInfo(nx, player.position.z))) { player.position.x = nx; }
    else if (canStep(cur, groundInfo(player.position.x, nz))) { player.position.z = nz; }
    else if (walkTarget) walkTarget = null;
  }
  const gi = groundInfo(player.position.x, player.position.z);
  if (gi) player.position.y += (gi.y - player.position.y) * Math.min(1, 14 * dt);
}
function updateBow(dt) {
  if (!upperG) return;
  if (bowing) {
    bowT += dt;
    const T = 1.6;
    if (bowT >= T) { bowing = false; upperG.rotation.x = 0; }
    else {
      const p = bowT / T;
      const a = p < 0.44 ? (p / 0.44) : (p < 0.56 ? 1 : 1 - (p - 0.56) / 0.44);
      upperG.rotation.x = 0.6 * a * a * (3 - 2 * a);
    }
  }
}
function updateChip() {
  const d = Math.hypot(player.position.x - END_DISC.x, player.position.z - END_DISC.z);
  if (d > 1.9) { bowChip.style.display = 'none'; return; }
  projV.set(END_DISC.x, END_DISC.y + 1.75, END_DISC.z).project(camera);
  if (projV.z > 1) { bowChip.style.display = 'none'; return; }
  bowChip.style.display = 'block';
  bowChip.style.left = ((projV.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  bowChip.style.top = ((-projV.y * 0.5 + 0.5) * window.innerHeight) + 'px';
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  movePlayer(dt);
  updateBow(dt);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 115) c.position.x = -115;
  }
  // camera target follows the avatar; camera rides along by the same delta
  camTmp.set(player.position.x, player.position.y + 1.0, player.position.z);
  camDelta.copy(camTmp).sub(controls.target).multiplyScalar(Math.min(1, 5 * dt));
  controls.target.add(camDelta);
  camera.position.add(camDelta);
  controls.update();
  updateChip();
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    bootMark('frame-1');
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
  }
}
animate();
</script>
</body>
